---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check bundle script
        run: python3 -m py_compile scripts/bundle-tesseract.py

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o blurcut .

      - name: Build Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o blurcut.exe .

      - name: Smoke test
        run: ./blurcut --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: blurcut-linux-amd64
          path: blurcut
