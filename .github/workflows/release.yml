name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test and build (linux amd64 + arm64, windows amd64)
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o blurcut-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o blurcut-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o blurcut.exe .
          zip -j blurcut-windows-amd64.zip blurcut.exe README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blurcut-linux-amd64
            blurcut-linux-arm64
            blurcut-windows-amd64.zip
          generate_release_notes: true
